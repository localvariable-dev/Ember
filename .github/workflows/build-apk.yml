name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  JAVA_VERSION: '17'
  EXPO_PUBLIC_BILLING_MODE: 'mock'
  REQUIRE_PRODUCTION_SIGNING: 'false'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Generate placeholders (so asset verification succeeds in CI)
        run: npm run placeholders

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Verify audio assets
        run: npm run verify:assets

      - name: Run tests (IST timezone)
        run: TZ=Asia/Kolkata npx jest --runInBand --forceExit --ci

      - name: Run tests (EST timezone)
        run: TZ=America/New_York npx jest --runInBand --forceExit --ci

  build-apk:
    name: Build Android APK
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Generate placeholders
        run: npm run placeholders

      - name: Generate native project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Validate and configure release keystore
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRE_PRODUCTION_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || env.REQUIRE_PRODUCTION_SIGNING }}
        run: |
          PROD_SIGNING_VALID=false
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # Clean and decode base64 safely
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/release.keystore 2>/dev/null || true
            # Validate keystore structure, password, and alias without exposing secrets
            if [ -s android/app/release.keystore ] && keytool -list -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              PROD_SIGNING_VALID=true
            fi
          fi

          if [ "$PROD_SIGNING_VALID" = "true" ]; then
            echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=ember-release-apk" >> "$GITHUB_ENV"
            # Production releases retain all architectures for Play Store distribution
            echo "TARGET_ARCH=armeabi-v7a,arm64-v8a,x86,x86_64" >> "$GITHUB_ENV"
            echo "::notice::Production release keystore verified successfully. Configuring release signing."
            printf '\nEMBER_RELEASE_STORE_FILE=release.keystore\nEMBER_RELEASE_STORE_PASSWORD=%s\nEMBER_RELEASE_KEY_ALIAS=%s\nEMBER_RELEASE_KEY_PASSWORD=%s\n' \
              "$KEYSTORE_PASSWORD" \
              "$KEY_ALIAS" \
              "$KEY_PASSWORD" >> android/gradle.properties
          else
            # Remove any invalid/empty file so Gradle cleanly triggers debug signing fallback
            rm -f android/app/release.keystore
            if [ "$REQUIRE_PRODUCTION_SIGNING" = "true" ]; then
              echo "::error::Production signing was strictly required, but the keystore is invalid, corrupted, or credentials do not match."
              exit 1
            fi
            echo "SIGNING_MODE=testing-debug-signed" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=ember-testing-apk" >> "$GITHUB_ENV"
            # Testing build targeted for 64-bit ARM device (e.g. OnePlus Nord 5) to optimize APK size
            echo "TARGET_ARCH=arm64-v8a" >> "$GITHUB_ENV"
            echo "::warning::Production signing credentials are absent or invalid (keystore failed verification). Falling back to debug signing for this testing build. Target ABI: arm64-v8a."
          fi

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            -PreactNativeArchitectures="${{ env.TARGET_ARCH || 'arm64-v8a' }}"

      - name: Verify APK size, ABI, and identify build
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          # Deterministic APK discovery
          if [ -f "$APK_DIR/app-arm64-v8a-release.apk" ]; then
            APK_PATH="$APK_DIR/app-arm64-v8a-release.apk"
          elif [ -f "$APK_DIR/app-release.apk" ]; then
            APK_PATH="$APK_DIR/app-release.apk"
          else
            APK_PATH=$(find "$APK_DIR" -maxdepth 1 -type f -name "*release*.apk" ! -name "*unaligned*" | sort | head -1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not found in $APK_DIR"
            exit 1
          fi

          echo "Discovered APK: $APK_PATH"

          # Verify native architectures inside the APK using unzip and apkanalyzer
          echo "=== Native Library Inspection ==="
          INCLUDED_ABIS=$(unzip -l "$APK_PATH" | grep -o 'lib/[^/]*' | sort -u | sed 's/lib\///' || true)
          echo "Included native ABIs: $INCLUDED_ABIS"

          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer apk summary "$APK_PATH" || true
          elif [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" apk summary "$APK_PATH" || true
          fi

          SIZE_MB=$(du -m "$APK_PATH" | cut -f1)
          echo "APK size: ${SIZE_MB} MB ($APK_PATH)"
          if [ "$SIZE_MB" -gt 90 ]; then
            echo "::error::APK size ${SIZE_MB} MB exceeds 90 MB hard limit"
            exit 1
          fi

          MODE="${SIGNING_MODE:-testing-debug-signed}"
          if [ "$MODE" = "testing-debug-signed" ]; then
            FINAL_APK="$APK_DIR/ember-testing-debug-signed.apk"
            mv "$APK_PATH" "$FINAL_APK"
          else
            FINAL_APK="$APK_PATH"
          fi
          echo "FINAL_APK_PATH=$FINAL_APK" >> "$GITHUB_ENV"

          echo "### Android Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Signing Mode:** \`${MODE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target Architecture:** \`${TARGET_ARCH:-arm64-v8a}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Included ABIs:** \`${INCLUDED_ABIS}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK Size:** \`${SIZE_MB} MB\` (hard limit: 90 MB)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact File:** \`$(basename "$FINAL_APK")\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = "testing-debug-signed" ]; then
            echo "> [!NOTE]" >> "$GITHUB_STEP_SUMMARY"
            echo "> This APK is signed with the Android debug certificate and optimized for ARM64 devices (OnePlus Nord 5). It is **NOT** signed for Google Play Store release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> [!TIP]" >> "$GITHUB_STEP_SUMMARY"
            echo "> This APK is signed with the production release keystore with full multi-architecture support." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify no placeholder audio in release
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push' && env.SIGNING_MODE == 'release'
        run: |
          if grep -q '"placeholder": true' src/audio/protocols.generated.json 2>/dev/null; then
            echo "::error::Release build contains placeholder audio assets"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME || 'ember-testing-apk' }}
          path: ${{ env.FINAL_APK_PATH || 'android/app/build/outputs/apk/release/*.apk' }}
          retention-days: 30
          if-no-files-found: error
